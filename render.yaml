services:
  # Bot Telegram boutique (existant)
  - type: worker
    name: telegram-shop-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: SOLANA_ADDRESS
        sync: false

  # Machine à Cache — Trading Bot
  - type: worker
    name: machine-a-cache-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m trading_bot.main
    envVars:
      - key: INITIAL_CAPITAL
        value: "10000"
      - key: PAPER_TRADING
        value: "true"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_POSITION_PCT
        value: "0.02"
      - key: MAX_DAILY_LOSS_PCT
        value: "0.03"
      - key: MAX_DRAWDOWN_PCT
        value: "0.10"
      - key: MAX_CONCURRENT_POSITIONS
        value: "10"
      - key: SIGNAL_THRESHOLD
        value: "0.6"
