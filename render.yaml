services:
  # Telegram boutique bot (existing)
  - type: web
    name: telegram-bot-shop
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: SOLANA_ADDRESS
        sync: false

  # Machine à Cache — Trading Bot
  - type: worker
    name: machine-a-cache
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m trading_bot.main"
    envVars:
      - key: INITIAL_CAPITAL
        value: "10000"
      - key: PAPER_TRADING
        value: "true"
      - key: EXCHANGE_ID
        value: "binance"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SYMBOLS
        value: "BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,MATIC/USDT,DOT/USDT"
      - key: MAX_POSITION_PCT
        value: "0.02"
      - key: MAX_DAILY_LOSS_PCT
        value: "0.03"
      - key: MAX_DRAWDOWN_PCT
        value: "0.10"
      - key: SCAN_INTERVAL
        value: "1.0"
      - key: SENTIMENT_INTERVAL
        value: "300"
